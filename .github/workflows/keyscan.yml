# Temporary: decompiles the fish mods' entity classes. Not merged to main.
name: Key scan
on:
  push:
    branches: [keybind-scan]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: curl -sSL -o vineflower.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.10.1/vineflower-1.10.1.jar
      - run: python3 tools/entscan.py && gzip -f entscan.txt && ls -la entscan.txt.gz
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f entscan.txt.gz
          git commit -m "Item scan output [skip ci]" && git push
