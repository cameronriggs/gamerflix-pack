# Temporary: scans the pack for mods that add music. Not merged to main.
name: Key scan
on:
  push:
    branches: [keybind-scan]
permissions:
  contents: write
jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: pack }
      - uses: actions/checkout@v4
        with: { path: self }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Scan
        run: |
          sudo apt-get install -y ffmpeg > /dev/null 2>&1 || true
          cd pack
          curl -sSL -o vineflower.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.10.1/vineflower-1.10.1.jar
          python3 ../self/tools/musicscan.py
          gzip -c musicscan.txt > ../self/musicscan.txt.gz
          gzip -c musicsrc.txt > ../self/musicsrc.txt.gz
      - name: Commit result
        run: |
          cd self
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f musicscan.txt.gz musicsrc.txt.gz
          git commit -m "Music scan output [skip ci]" && git push
